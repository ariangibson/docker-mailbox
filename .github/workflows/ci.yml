name: ci

# Tests every push and pull request. Pushes to main (and v* tags) also publish
# the image to ghcr.io/<owner>/<repo>, so `:latest` always tracks main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true

      # Python comes from .python-version, dependencies strictly from uv.lock.
      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: |
          uv run --no-sync flake8 src tests
          uv run --no-sync mypy src

      - name: Test
        run: uv run --no-sync pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests build and smoke-test the image but never publish it.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mailboxd:ci
          cache-from: type=gha

      # Boot the real image before anyone pulls it: a bad configuration has to
      # exit (not crash-loop), and an env-only one has to come up and serve.
      - name: Smoke-test the image
        run: |
          set -euo pipefail

          if docker run --rm mailboxd:ci > no-config.log 2>&1; then
            echo "::error::container started with no configuration at all"
            exit 1
          fi
          cat no-config.log
          grep -q "config not found" no-config.log

          docker run -d --name smoke -p 8000:8000 \
            -e MAILBOX_AUTH_TOKENS=ci-token \
            -e MAILBOX_CI='purelymail:ci@example.com:not:a,real@password' \
            mailboxd:ci
          trap 'docker logs smoke' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mailboxes)" = 401
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:8000/mailboxes \
            | grep -q '"name":"ci"'

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :latest and :main; every build -> :sha-<short>; v1.2.3 -> :1.2.3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
